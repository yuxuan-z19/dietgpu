repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
        # The upstream hook ships `args: []`, so out of the box it only reports.
        # --fix is required for the "I" (import sorting) rule enabled in
        # pyproject.toml to actually reorder anything instead of just failing the
        # commit; --exit-non-zero-on-fix keeps the hook red so you notice files
        # were rewritten and re-stage them.
        args: [--fix, --exit-non-zero-on-fix]
        exclude: |
          ^($(git config --file .gitmodules --get-regexp path | awk '{print $2}' | tr '\n' '|'))
      # Run the formatter.
      - id: ruff-format
        exclude: |
          ^($(git config --file .gitmodules --get-regexp path | awk '{print $2}' | tr '\n' '|'))

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v23.1.3"
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        exclude: |
          ^($(git config --file .gitmodules --get-regexp path | awk '{print $2}' | tr '\n' '|'))
